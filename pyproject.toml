[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statcheck"
version = "0.2.0"
description = "Plugin-driven static analysis pipeline for PE/ELF/Mach-O files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "lief>=1.0.0",
    "pefile>=2024.8.26",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "vt-py>=0.20.0",
    "yara-python>=4.3.0",
]

[project.optional-dependencies]
hashes = [
    "ppdeep>=20260221",
    "py-tlsh>=5.0.0",
]
# Optional hash wheels that sometimes fail to build on constrained CI
# runners are NOT in `dev` so the default gate stays installable.
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",
    "responses",
]

[project.scripts]
statcheck = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "src",
    "src.core",
    "src.analyzers",
    "src.analyzers.pe",
    "src.analyzers.elf",
    "src.reporters",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "bin", "reports", "test_binaries", "yara_rules","*.md", "docs/"]

[tool.ruff.lint]
# Pragmatic initial selection; documented ignores can be tightened later.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Tighten module by module later; keep the initial gate pragmatic.
check_untyped_defs = false
